[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usher-pipeline"
version = "0.1.0"
description = "Reproducible pipeline for prioritizing Usher syndrome and related ciliopathy candidate genes"
requires-python = ">=3.11"
authors = [
    {name = "Research Team"}
]
readme = "README.md"
# License metadata is intentionally omitted until the authors add and confirm
# the complete repository license for the public release.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "mygene>=3.2.0",
    "requests>=2.31.0",
    "requests-cache>=1.1.0",
    "tenacity>=8.2.0",
    "pydantic>=2.0",
    "pydantic-yaml>=1.2.0",
    "duckdb>=0.9.0",
    "click>=8.1.0",
    "polars>=0.19.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "structlog>=25.0",
    "biopython>=1.84",
    "scipy>=1.14",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
expression = [
    "cellxgene-census>=1.17,<2",
]

[project.scripts]
usher-pipeline = "usher_pipeline.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
